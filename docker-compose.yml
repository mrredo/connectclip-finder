services:
  connectclip-finder:
    build: .
    container_name: connectclip-finder
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/connectclip.db
      - SCAN_INTERVAL=30m
      - HTTP_ENABLED=true
      - HTTP_ADDR=:8080

